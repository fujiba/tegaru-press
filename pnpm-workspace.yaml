# pnpmの設定ファイル（workspaceは使っていない。pnpm 10以降の設定置き場）

# 依存追加時にバージョンを ^ なしの完全固定で記録する
savePrefix: ""

# 公開から7日(10080分)未満のパッケージはインストールしない。
# 乗っ取られたパッケージの悪意あるバージョンは公開直後に配布されることが
# 多く、発覚・取り下げまでの時間を稼ぐサプライチェーン対策。
minimumReleaseAge: 10080

# 依存パッケージのインストール時スクリプト(postinstall等)は実行しない。
# biomeはプラットフォーム別バイナリをoptionalDependenciesで配布しており、
# スクリプトなしでも動作する。新しい依存で動かないものが出たら個別にtrueにする。
allowBuilds:
  "@biomejs/biome": false

<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <style>
      .container { padding: 20px; }
      .form-group { margin-bottom: 15px; }
      label { font-weight: bold; display: block; margin-bottom: 5px; }
      input[type="text"], input[type="datetime-local"] { width: 100%; }
      .buttons { margin-top: 20px; text-align: right; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form-group">
        <label for="title">タイトル</label>
        <input type="text" id="title" name="title" required>
      </div>

      <div class="form-group">
        <label for="date">公開日時</label>
        <input type="datetime-local" id="date" name="date" required>
      </div>

      <div class="buttons">
        <button class="action" onclick="submitForm()">作成</button>
        <button onclick="google.script.host.close()">キャンセル</button>
      </div>
    </div>

    <script>
      // ページ読み込み時に現在日時をセット
      window.onload = function() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('date').value = now.toISOString().slice(0,16);
      };

      function submitForm() {
        const form = {
          title: document.getElementById('title').value,
          date: document.getElementById('date').value
        };

        if (!form.title || !form.date) {
          alert('タイトルと公開日時を入力してください。');
          return;
        }

        // ボタンを無効化
        document.querySelector('.action').disabled = true;
        
        google.script.run
          .withSuccessHandler(() => google.script.host.close())
          .withFailureHandler(err => alert(err.message))
          .executeInsertFrontMatter(form);
      }
    </script>
  </body>
</html>

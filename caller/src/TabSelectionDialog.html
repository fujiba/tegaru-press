<!doctype html>
<html>
  <head>
    <base target="_top" />
    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        padding: 1rem;
        color: #333;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      .tab-list {
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 0.5rem;
        border-radius: 4px;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
      }
      .buttons {
        margin-top: 1.5rem;
        text-align: right;
        border-top: 1px solid #eee;
        padding-top: 1rem;
      }
      button {
        padding: 10px 18px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      #action-btn {
        background-color: #007bff;
        color: white;
      }
      #action-btn:disabled {
        background-color: #aaa;
      }
      #cancel-btn {
        background-color: #f1f1f1;
        color: #333;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <form id="tab-selection-form">
      <div class="form-group">
        <label for="tabs">処理するタブを選択してください:</label>
        <div class="tab-list">
          <? if (action === 'push') { ?>
            <? for (var i = 0; i < tabs.length; i++) { ?>
              <label><input type="checkbox" name="selected_tabs" value="<?= tabs[i].id ?>"> <?= tabs[i].title ?></label>
            <? } ?>
          <? } else { ?>
            <? for (var i = 0; i < tabs.length; i++) { ?>
              <label><input type="radio" name="selected_tabs" value="<?= tabs[i].id ?>"> <?= tabs[i].title ?></label>
            <? } ?>
          <? } ?>
        </div>
      </div>

      <div class="buttons">
        <button type="submit" id="action-btn"><?= action === 'push' ? '選択したタブをPush' : 'プレビュー' ?></button>
        <button type="button" id="cancel-btn">キャンセル</button>
      </div>
    </form>

    <script>
      document.getElementById("cancel-btn").addEventListener("click", () => google.script.host.close());

      document.getElementById("tab-selection-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const btn = document.getElementById("action-btn");
        btn.disabled = true;
        btn.textContent = "処理中...";

        const selected = Array.from(this.elements.selected_tabs).filter(el => el.checked).map(el => el.value);
        const action = "<?= action ?>";
        const serverFunction = action === 'push' ? '_executePushForTabs' : '_executePreviewForTab';
        google.script.run.withSuccessHandler(() => google.script.host.close())[serverFunction](selected);
      });
    </script>
  </body>
</html>
